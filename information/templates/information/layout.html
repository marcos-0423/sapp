<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام إدارة المشفى العمالي بحمص{% endblock %}</title>
    <style>
        /* التنسيق العام والخلفية */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #dfe9f3 100%);
            margin: 0;
            padding: 40px 20px;
            color: #333;
            min-height: 100vh;
        }

        /* حاوية البيانات الرئيسية المتمركزة */
        .container {
            max-width: 700px;
            background-color: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        h2 {
            color: #2b6cb0;
            font-size: 18px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        /* بطاقة معلومات المريض */
        .patient-info {
            background-color: #f7fafc;
            border-right: 4px solid #3182ce;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 15px;
        }

        .info-label {
            font-weight: bold;
            color: #4a5568;
        }

        /* تنسيق الجدول */
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #3182ce;
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 15px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #4a5568;
        }

        tr:hover {
            background-color: #f1f7fd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>نظام إدارة المشفى العمالي بحمص</h1>
        
        <!-- هنا سيتم حقن محتوى الصفحات الفرعية تلقائياً -->
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
